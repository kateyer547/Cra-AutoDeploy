[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# zip 8.x reste tiré par docx-rs 0.4.22 (dernière version) : ces alertes ne
# visent que l'extraction d'archives ; le projet et docx-rs ne font qu'écrire.
# À retirer dès qu'une version de docx-rs dépend de zip >= 9.
ignore = [
  { id = "RUSTSEC-2026-0367", reason = "extraction seulement ; zip 8 via docx-rs, écriture seule" },
  { id = "RUSTSEC-2026-0368", reason = "extraction seulement ; zip 8 via docx-rs, écriture seule" },
  { id = "RUSTSEC-2026-0369", reason = "extraction seulement ; zip 8 via docx-rs, écriture seule" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
