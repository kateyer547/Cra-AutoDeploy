services:
  # Tunnel dédié à ce projet (distinct de celui d'une autre appli sur la machine) :
  # connexion sortante uniquement, aucun port publié. Le hostname public se
  # déclare dans Cloudflare Zero Trust et pointe vers http://caddy:80.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:?définir TUNNEL_TOKEN dans .env}
    depends_on: [caddy]

  # TLS terminé par Cloudflare : Caddy ne sert plus qu'en HTTP interne
  # (en-têtes de sécurité, authentification).
  caddy:
    image: caddy:2
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      app: { condition: service_healthy }

  app:
    image: ghcr.io/${GITHUB_OWNER}/cra:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - RUST_LOG=info
      - CRA_DB_PATH=/data/cra.db
      - CRA_ALLOWED_ORIGINS=${APP_ORIGIN:-}
    volumes:
      - ./data:/data
    healthcheck: # distroless : pas de curl, d'où une sous-commande du binaire
      test: ["CMD", "/app/cra-server", "healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    # pas de "ports:" : l'appli n'est joignable que par Caddy, lui-même derrière le tunnel
